name: ASAA Organization Policy CI

on:
  push:
    branches: [new]
  pull_request:
    branches: [new, dev, main]
  workflow_dispatch:
  # Reusable entry point so each project repository can run the same policy gate on its own pull requests.
  workflow_call:
    inputs:
      configuration-ref:
        description: Configuration ref that holds the policy (defaults to new)
        type: string
        default: new

permissions:
  contents: read

concurrency:
  group: organization-policy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  policy:
    name: Cross-repository policy and configuration checks
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out Configuration
        uses: actions/checkout@v4
        with:
          repository: ASAA1229/Configuration
          ref: ${{ inputs.configuration-ref || github.ref }}
          path: Configuration

      - name: Check out ASAA
        uses: actions/checkout@v4
        with:
          repository: ASAA1229/ASAA
          ref: new
          path: ASAA

      - name: Check out JARVIS
        uses: actions/checkout@v4
        with:
          repository: ASAA1229/JARVIS
          ref: new
          path: JARVIS

      - name: Check out Templates
        uses: actions/checkout@v4
        with:
          repository: ASAA1229/Templates
          ref: new
          path: Templates

      - name: Check out Portfolio
        uses: actions/checkout@v4
        with:
          repository: ASAA1229/Portfolio
          ref: new
          path: Portfolio

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Run Configuration unit tests
        working-directory: Configuration
        run: node --test checks/test/*.test.mjs

      - name: Run cross-repository policy checks
        working-directory: Configuration
        env:
          ASAA_CONFIG_ENV: ci
        run: node checks/check-all.mjs --env ci --out policy-report.json

      - name: Upload machine-readable policy report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: policy-report
          path: Configuration/policy-report.json
          if-no-files-found: warn
          retention-days: 30
