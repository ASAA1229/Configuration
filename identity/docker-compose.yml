# ASAA single sign-on (Keycloak). Local only: the port is bound to 127.0.0.1.
# Image is pinned to an exact tag and listed in policy/install-import-policy.json.
# Start and stop with identity/scripts/start.ps1 and stop.ps1.
name: asaa-identity

services:
  keycloak:
    image: quay.io/keycloak/keycloak:26.8.1
    container_name: asaa-keycloak
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    # start-dev: local development mode with file-based storage. Realm files in ./realm are imported on first start.
    command: ["start-dev", "--import-realm"]
    environment:
      # Bootstrap admin. The username is the Keycloak default. The password comes from identity/.env, which the owner fills in.
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_BOOTSTRAP_ADMIN_PASSWORD:?Set KC_BOOTSTRAP_ADMIN_PASSWORD in identity/.env}
      # Issuer must match the ASAA token validation config: http://127.0.0.1:8280/realms/asaa
      KC_HOSTNAME: http://127.0.0.1:8280
      KC_HOSTNAME_STRICT: "true"
      KC_HOSTNAME_STRICT_HTTPS: "false"
      KC_HTTP_ENABLED: "true"
      KC_HTTP_HOST: 0.0.0.0
      KC_HTTP_PORT: "8080"
      # Health endpoints are served on the management port (9000), reachable only inside the container.
      KC_HEALTH_ENABLED: "true"
      KC_METRICS_ENABLED: "false"
      # Local dev-file storage (gitignored under identity/data).
      KC_DB: dev-file
      # Telemetry and outbound features are disabled. Keycloak makes no calls to external services by default.
      KC_TRACING_ENABLED: "false"
    ports:
      - "127.0.0.1:8280:8080"
    volumes:
      - ./realm:/opt/keycloak/data/import:ro
      - ./data:/opt/keycloak/data
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          bash -c 'exec 3<>/dev/tcp/127.0.0.1/9000 && printf "GET /health/ready HTTP/1.0\r\nHost: localhost\r\n\r\n" >&3 && head -n 1 <&3 | grep -q " 200"'
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 60s
